[project]
name = "library-hub"
version = "0.1.0"
description = "LibraryHub - digital library with catalog and loan microservices"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.21",
    "pytest-bdd>=7.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "hypothesis>=6.0",
    "testcontainers[postgres,rabbitmq]>=3.7",
    "cosmic-ray>=8.3",
    "mypy>=1.5",
    "ruff>=0.1",
    "interrogate>=1.5",
    "pip-audit>=2.7",
    "radon>=6.0",
    "bandit>=1.7",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["catalog", "catalog.*", "loans", "loans.*", "users", "users.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_steps.py"]
asyncio_mode = "auto"
markers = [
        "catalog: scenarios for the catalog service",
        "loans: scenarios for the loan service",
    ]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.importlinter]
root_packages = ["catalog", "loans"]
contracts = [
    { name = "Catalog dependency direction: infrastructure -> application -> domain", type = "layers", layers = ["catalog.infrastructure", "catalog.application", "catalog.domain"] },
    { name = "Loans dependency direction: infrastructure -> application -> domain", type = "layers", layers = ["loans.infrastructure", "loans.application", "loans.domain"] },
]
