# Mutation testing session config for the catalog service (architect's gate).
#
# Scope: domain/ + application/ only, per the quality-gate rule "mutation
# score >= 80% on domain/ and application/".
#
# Exclusions, with rationale:
# - catalog/infrastructure/** — infra is excluded from the mutation gate by
#   the constitution (unit tests mock ports; only slow acceptance tests
#   exercise it). The glob must reach the .py files: cosmic-ray's
#   excluded-modules subtracts exact path matches, so "catalog/infrastructure/*"
#   only matches the subdirectories and silently excludes nothing.
# - catalog/domain/ports.py — interface-only module: zero executable
#   statements. cosmic-ray generates mutants only for the `Book | None`
#   annotation (never evaluated under PEP 563) and the @abstractmethod
#   decorators; all are equivalent mutants. The port's contract is covered
#   by tests/unit/catalog/domain/test_ports.py instead.
#
# Run from the worktree root:
#   <project_root>/.venv/Scripts/cosmic-ray init mutation-catalog.toml mutation-catalog.sqlite
#   <project_root>/.venv/Scripts/cosmic-ray exec mutation-catalog.toml mutation-catalog.sqlite
#   <project_root>/.venv/Scripts/cr-rate --fail-over 20 mutation-catalog.sqlite
# Delete mutation-catalog.sqlite (and any mutant working copies) before re-running.

[cosmic-ray]
module-path = "catalog"
timeout = 60.0
excluded-modules = ["catalog/infrastructure/**/*.py", "catalog/domain/ports.py"]
test-command = "C:/projekte/agentic-coding/library-hub-testrun3/.venv/Scripts/python -m pytest tests/unit -x -q"

[cosmic-ray.distributor]
name = "local"
